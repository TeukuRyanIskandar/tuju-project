# pnpm workspace — TS world only (ADR-0002).
# services/ai is deliberately NOT listed: Python is its own uv-managed
# world, outside the pnpm workspace and the Turbo task graph.
packages:
  - "apps/*"
  - "packages/*"

# Native postinstall build scripts we explicitly allow so `pnpm install` runs
# clean instead of warning about (and failing on) an ignored build.
# pnpm 11 replaced pnpm-10's `onlyBuiltDependencies` list with the `allowBuilds`
# map (name: true|false); the old key is silently ignored under pnpm 11.
#   - esbuild          transitive dep of vitest (ticket 02) + vite (ticket 04)
#   - lightningcss     transitive native dep of vite 8 (ticket 04 frontend)
#   - msgpackr-extract transitive native dep of bullmq (ticket 03 backend) and
#                      @tanstack/react-start's nitro/vite pipeline (ticket 04)
# The `false` entries are optional native addons pulled in transitively by
# @testcontainers/* (via ssh2/dockerode), used only by the integration lane.
# We deliberately DO NOT build them — they are perf-only optionals and
# testcontainers works without them. Marking them false (not leaving them
# undecided) keeps `pnpm install --frozen-lockfile` exiting 0 in CI instead of
# erroring on an ignored build (ERR_PNPM_IGNORED_BUILDS).
allowBuilds:
  cpu-features: false
  esbuild: true
  lightningcss: true
  msgpackr-extract: true
  protobufjs: false
  ssh2: false
