# pnpm workspace — TS world only (ADR-0002).
# services/ai is deliberately NOT listed: Python is its own uv-managed
# world, outside the pnpm workspace and the Turbo task graph.
packages:
  - "apps/*"
  - "packages/*"

# esbuild ships a native binary via a postinstall build script; it is a
# transitive dependency of vitest (contracts test runner, ticket 02). Allow it
# so `pnpm install` runs clean instead of warning about an ignored build.
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: set this to true or false
