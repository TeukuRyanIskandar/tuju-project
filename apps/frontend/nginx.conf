# nginx config for the TanStack Start static SPA (ticket 06, ADR-0005).
# Serves the prerendered shell (_shell.html) as the SPA fallback for any client
# route; hashed assets are served directly. A CDN plays this role in prod.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset bundles — long cache, served directly.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every route resolves to the prerendered shell.
    location / {
        try_files $uri $uri/ /_shell.html;
    }
}
