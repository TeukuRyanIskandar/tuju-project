[project]
name = "tuju-ai"
version = "0.1.0"
description = "Bursa platform AI worker (Python + LangGraph). Its own uv-managed world, outside the pnpm/Turbo graph (ADR-0002)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "datamodel-code-generator>=0.25.0",
    "pydantic>=2.0.0",
]
