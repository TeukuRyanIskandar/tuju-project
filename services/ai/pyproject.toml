[project]
name = "tuju-ai"
version = "0.1.0"
description = "Bursa platform AI worker (Python + LangGraph). Its own uv-managed world, outside the pnpm/Turbo graph (ADR-0002)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # JobBus transport — official BullMQ Python bindings (ADR-0001).
    "bullmq>=3.2.8,<4.0.0",
    # UNUSED since the LangGraph stub was deleted (architecture-deepening 02);
    # kept pending an explicit removal (it would change uv.lock).
    "langgraph>=1.2.12,<2.0.0",
    # S3 claim-check writer; LocalStack locally (ADR-0004).
    "boto3>=1.43.104,<2.0.0",
    # Runtime conformance validation of the wire contract (ADR-0007 / ADR-0011).
    "pydantic>=2.0.0,<3.0.0",
    # NestJS data-API reads for the stateless worker (ADR-0004); spec-06 ticket 02/03.
    "httpx>=0.27.0,<1.0.0",
    # The default prospectus parse (prospectus-v2 ticket 01): headings from the
    # PDF TOC or typography, text blocks in reading order with page numbers.
    # Seconds per PDF, no torch — a base dep, so one worker image serves all jobs.
    "pymupdf>=1.28.0,<2.0.0",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[project.optional-dependencies]
# Legacy Docling layout parse (spec 06, research ticket 08), kept for
# comparison and a future GPU path; the worker image does NOT install it.
# It drags torch + model downloads. Install with `uv sync --extra parse-ml`.
# torch/torchvision are declared explicitly (Docling needs them anyway) so the
# CPU-index source pin below actually applies — uv only honors tool.uv.sources
# index pins for the project's own requirements, not transitive ones.
parse-ml = [
    "docling>=2.31.5,<3.0.0",
    "torch>=2.2.2,<3.0.0",
    "torchvision>=0.14,<1.0.0",
]

[project.scripts]
# `uv run tuju-ai-worker` boots the worker; `uv run tuju-ai-smoke` runs the
# offline smoke entrypoint (no live Redis/S3 required). `tuju-ai-prospectus-parse`
# parses + routes a prospectus PDF and claim-checks the parse (spec 06, ticket 04).
tuju-ai-worker = "tuju_ai.worker:main"
tuju-ai-smoke = "tuju_ai.smoke:main"
tuju-ai-prospectus-parse = "tuju_ai.prospectus.cli:main"

[tool.uv]
# CPU-only torch wheels (docling's own CI recommendation): the prospectus parse
# is CPU-bound, so the ~10x smaller CPU wheel beats the default CUDA build on
# every platform (dev syncs, CI, the worker image).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "datamodel-code-generator>=0.25.0",
    "pydantic>=2.0.0",
    # Integration lane (ADR-0011): programmatic throwaway Redis + LocalStack S3
    # containers for the JobBus round-trip. Docker-only; the tests skip cleanly
    # when no daemon is reachable so the unit lane stays infra-free.
    "testcontainers[localstack]>=4.0.0,<5.0.0",
]

[tool.pytest.ini_options]
# `unit` runs everywhere with no live infra; `integration` spins up real
# testcontainers (Redis + LocalStack S3) for the JobBus round-trip (ADR-0011)
# and is deselected from the fast unit/PR lane. `corpus` parses the real demo
# prospectus PDFs (PyMuPDF, a few seconds) and is likewise deselected from the
# fast lane.
markers = [
    "unit: fast tests with no external infra (Redis/S3 not required)",
    "integration: requires testcontainers (Redis + LocalStack S3); run with -m integration",
    "corpus: parses the real demo-corpus prospectus PDFs; run with -m corpus",
]
testpaths = ["tests"]
